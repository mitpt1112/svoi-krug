  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Бегущая строка */
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marquee 28s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }

    /* Мягкая пульсация в ритме сердца */
    @keyframes heartbeatRing {
      0% { transform: scale(1); opacity: 0.8; }
      14% { transform: scale(1.6); opacity: 0.4; }
      28% { transform: scale(1.15); opacity: 0.7; }
      42% { transform: scale(2.1); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }

    @keyframes heartbeatDot {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.2); }
      28% { transform: scale(1.05); }
      42% { transform: scale(1.3); }
      70% { transform: scale(1); }
    }

    .heartbeat-ring {
      animation: heartbeatRing 2.6s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .heartbeat-dot {
      animation: heartbeatDot 2.6s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    /* Ротатор с мягким градиентным отсечением */
    .rotator-track {
      display: inline-flex;
      position: relative;
      overflow: hidden;
      height: 1.25em;
      line-height: 1.25;
      vertical-align: -0.18em;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .rotator-slider {
      display: flex;
      flex-direction: column;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .rotator-slider > span {
      display: flex;
      align-items: center;
      height: 1.25em;
      line-height: 1.25;
      white-space: nowrap;
    }

    /* Анимация ошибки и покачивания инпута */
    @keyframes inputShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .field-error {
      border-color: #D2F802 !important;
      box-shadow: 0 0 16px rgba(210, 248, 2, 0.25) !important;
      animation: inputShake 0.35s ease;
    }

    /* Кастомная фирменная подсказка валидации */
    .custom-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 12px;
      z-index: 40;
      background: #141416;
      border: 1px solid rgba(210, 248, 2, 0.5);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 12px rgba(210, 248, 2, 0.15);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      white-space: nowrap;
      animation: tooltipPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .custom-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 16px;
      border-width: 5px;
      border-style: solid;
      border-color: rgba(210, 248, 2, 0.5) transparent transparent transparent;
    }

    @keyframes tooltipPop {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
