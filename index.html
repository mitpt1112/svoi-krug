<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СВОЙ КРУГ — Спортивное бизнес-сообщество в Санкт-Петербурге</title>
  <meta name="description" content="Беговой клуб и турниры по падел-теннису для предпринимателей и управленцев в Санкт-Петербурге.">

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --lime: #D2F802;
      --dark: #08080A;
      --card: #121214;
      --border: #202024;
    }

    html, body {
      background-color: var(--dark);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      width: 100%;
    }

    /* Бегущая строка */
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 25s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }

    /* Пульсация сердца */
    @keyframes heartbeatRing {
      0% { transform: scale(1); opacity: 0.8; }
      14% { transform: scale(1.6); opacity: 0.4; }
      28% { transform: scale(1.15); opacity: 0.7; }
      42% { transform: scale(2.1); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }
    @keyframes heartbeatDot {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.2); }
      28% { transform: scale(1.05); }
      42% { transform: scale(1.3); }
      70% { transform: scale(1); }
    }
    .pulse-ring {
      animation: heartbeatRing 2.6s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .pulse-dot {
      animation: heartbeatDot 2.6s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    /* Ротатор слов */
    .rotator-container {
      display: inline-flex;
      position: relative;
      overflow: hidden;
      height: 1.25em;
      line-height: 1.25;
      vertical-align: -0.18em;
      transition: width 0.3s ease;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }
    .rotator-list {
      display: flex;
      flex-direction: column;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .rotator-list > span {
      display: flex;
      align-items: center;
      height: 1.25em;
      line-height: 1.25;
      white-space: nowrap;
      color: var(--lime);
    }

    /* Кастомная подсказка валидации */
    .field-error {
      border-color: var(--lime) !important;
      box-shadow: 0 0 16px rgba(210, 248, 2, 0.25) !important;
    }
    .custom-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 12px;
      z-index: 50;
      background: #141416;
      border: 1px solid rgba(210, 248, 2, 0.5);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      white-space: nowrap;
    }
    .custom-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 16px;
      border-width: 5px;
      border-style: solid;
      border-color: rgba(210, 248, 2, 0.5) transparent transparent transparent;
    }
  </style>
</head>
<body class="bg-[#08080A] text-white selection:bg-[#D2F802] selection:text-black">

          <span class="pulse-ring absolute inline-flex h-full w-full rounded-full bg-[#D2F802]"></span>
          <span class="pulse-dot relative inline-flex rounded-full h-2.5 w-2.5 bg-[#D2F802] shadow-[0_0_10px_#D2F802]"></span>
        </span>
        СВОЙ КРУГ
      </a>

      <nav class="hidden md:flex items-center gap-8 text-xs sm:text-sm font-bold tracking-wider uppercase">

        <a href="#padel" class="text-white/40 hover:text-[#D2F802] transition-colors">Падел-теннис</a>

      </button>
    </div>
